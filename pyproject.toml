[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-applying-bot"
version = "2.0.0"
description = "Evidence-first job analysis assistant: candidate truth, job intelligence, and human review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-SA-4.0" }

# Runtime dependencies for the canonical application in src/.
#
# These are the libraries src/ actually imports. The API boundary (FastAPI,
# Uvicorn) was previously undeclared, which made a clean install unable to start
# the server; it is declared here.
dependencies = [
    # API boundary (src/api/)
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # Domain models, settings, validation (src/core/, src/candidate_profile/, src/jobs/)
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Resume text extraction (src/resumes/)
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
# Everything needed to run the test suite.
#
# Selenium and friends are here, not in the main dependency list, because they
# are used *only* by the quarantined legacy bot at the repository root
# (utils.py, linkedin.py). tests/test_legacy.py imports those modules to prove
# they are still intact, so the test extra needs them. The canonical application
# in src/ imports no browser automation at all.
dev = [
    "pytest>=8.0.0",
    "selenium>=4.0.0",
    "webdriver_manager>=3.8.0",
    "selenium-stealth>=1.0.0",
    "pyyaml>=5.1",
]

[project.scripts]
# Console script for the existing, real entry point in src/assistant/cli.py.
#
# This is now possible. It was previously withheld because the package was named
# `profile`, which collides with the stdlib profiler shipped in Python <= 3.11:
# `Lib/` precedes `site-packages`, so `import profile` resolved to the stdlib and
# every canonical import failed for any installed distribution. The package is
# now `candidate_profile`, so an installed console script resolves correctly.
job-assistant = "assistant.cli:main"

# src/ is the import root: modules use absolute imports such as
# `from core.settings import ...`, so every package sits directly under src/.
#
# Discovery rather than a flat list, because a list of top-level names omits
# subpackages -- `api.routes`, `api.schemas` and `database.repositories` were
# silently left out of a non-editable install, which only worked while
# PYTHONPATH pointed at the source tree. `include` keeps discovery explicit so
# the TypeScript-only trees (src/components, src/lib, src/types) and
# src/database/migrations are never picked up: find_packages requires an
# __init__.py, which none of them have.
#
# `candidate_profile` was renamed from `profile` in R2-B to remove the stdlib
# collision described above.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "ai*",
    "api*",
    "assistant*",
    "audit*",
    "candidate_profile*",
    "core*",
    "database*",
    "jobs*",
    "resumes*",
    "safety*",
]

[tool.setuptools.package-data]
# Plain-SQL migrations are read from disk at runtime; without this they are
# absent from a non-editable install and database initialisation fails.
database = ["migrations/*.sql"]

[tool.pytest.ini_options]
# Declared here so `pytest` works from the repository root without a conftest
# flag. tests/conftest.py still owns sys.path arrangement, which is what keeps
# the root-level legacy modules importable for tests/test_legacy.py.
testpaths = ["tests"]